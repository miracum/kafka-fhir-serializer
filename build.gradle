// groovylint-disable NestedBlockDepth

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'com.diffplug.spotless' version '8.3.0'
    id 'jacoco'
    id 'io.gitee.pkmer.sonatype-central-publisher' version '1.1.0'
}

group = 'org.miracum'
version = '3.0.0' // x-release-please-version

java {
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    // the minimum Java version required by consumers: set explicitly so that it
    // doesn't silently follow whichever JDK happens to build the release.
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    // Types of both libraries are part of the public API (Serializer, IBaseResource, FhirContext, ...),
    // so they need to be on the compile classpath of consumers.
    api 'ca.uhn.hapi.fhir:hapi-fhir-base:8.8.0'
    api 'org.apache.kafka:kafka-clients:4.2.0'

    // Use JUnit Jupiter API for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.3'
    // The FHIR structures are deliberately not a dependency of the library itself:
    // consumers choose the FHIR version(s) they need.
    testImplementation 'ca.uhn.hapi.fhir:hapi-fhir-structures-r4:8.8.0'
    testImplementation 'ca.uhn.hapi.fhir:hapi-fhir-structures-r5:8.8.0'

    // Use JUnit Jupiter Engine for testing.
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
    testImplementation 'com.approvaltests:approvaltests:30.1.0'
}

test {
    // Use junit platform for unit tests
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        csv.required = true
        html.required = true
        xml.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.9
            }
        }
    }
}

check {
    dependsOn jacocoTestCoverageVerification
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'kafka-fhir-serializer'
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'Kafka FHIR® Serializer'
                description = 'Support for serializing and deserializing FHIR® resources in Apache Kafka.'
                url = 'https://github.com/miracum/kafka-fhir-serializer'
                licenses {
                    license {
                        name = 'Apache 2.0'
                        url = 'https://opensource.org/licenses/Apache-2.0'
                    }
                }
                developers {
                    developer {
                        id = 'MIRACUM'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/miracum/kafka-fhir-serializer.git'
                    developerConnection = 'scm:git:ssh://github.com:miracum/kafka-fhir-serializer.git'
                    url = 'https://github.com/miracum/kafka-fhir-serializer'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'Local'
            url = layout.buildDirectory.dir('repos/bundles')
        }
    }
}

javadoc {
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

signing {
    def signingKey = System.getenv('MIRACUM_SIGNING_KEY')
    def signingPassword = System.getenv('MIRACUM_SIGNING_KEY_PASSPHRASE')
    // without a key, e.g. when publishing to a local repository during development,
    // signing is skipped instead of failing the build.
    required = signingKey != null
    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications.mavenJava
}

pkmerBoot {
    sonatypeMavenCentral {
        // the same with publishing.repositories.maven.url in the configuration.
        stagingRepository = layout.buildDirectory.dir('repos/bundles')
        /**
         * get username and password from
         * <a href="https://central.sonatype.com/account"> central sonatype account</a>
         */
        username = System.getenv('OSSRH_USERNAME')
        password = System.getenv('OSSRH_PASSWORD')
    }
}

spotless {
    java {
        importOrder()
        removeUnusedImports()
        googleJavaFormat()
    }
}
